# Local setup: `docker compose up -d`, then open http://127.0.0.1:8765/
#
# Configure with environment variables or a .env file next to this one:
#   SCHEMATICS_DIR  folder with .litematic files, searched recursively (default: ./schematics)
#   PORT            host port (default: 8765)

services:
  viewer:
    build: .
    image: litematic-viewer
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-8765}:8765"
    volumes:
      - "${SCHEMATICS_DIR:-./schematics}:/schematics:ro"
